[package]
name = "BadNorthSaveConverter"
version = "0.1.0"
edition = "2021"
authors = ["ABaLaQiYaShanMai"]
description = "Bad North save game editor with JSON conversion support"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "BadNorthSaveConverter"
path = "src/main.rs"
